<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Chat - المنصة الرسمية</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e5ddd5; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; height: 92vh; }
        h2 { text-align: center; color: #075e54; margin-top: 0; }
        input, button, select { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background: #25d366; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #128c7e; }
        .hidden { display: none !important; }
        #chat-box { flex: 1; border: 1px solid #ddd; background: #efeae2; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 5px 0; border-radius: 8px; max-width: 75%; word-wrap: break-word; font-size: 14px; }
        .my-msg { background: #dcf8c6; align-self: flex-end; }
        .other-msg { background: #fff; align-self: flex-start; }
        .error { color: red; font-size: 13px; text-align: center; }
        
        /* الدائرة الزرقاء وجواها صح أبيض */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            background-color: #1da1f2;
            color: white;
            border-radius: 50%;
            font-size: 9px;
            font-weight: bold;
            margin-right: 3px;
            vertical-align: middle;
        }

        .terms-box { font-size: 11px; color: #666; background: #f9f9f9; padding: 8px; border: 1px solid #ddd; border-radius: 5px; height: 45px; overflow-y: auto; margin-bottom: 5px; }
        .admin-panel { background: #fff3cd; border: 1px solid #ffeeba; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; max-height: 120px; overflow-y: auto; }
        .contacts-bar { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 4px; }
        .contact-chip { background: #e2e8f0; padding: 5px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; white-space: nowrap; border: 1px solid #cbd5e1; color: #334155; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .contact-chip:hover { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mine Chat 🛡️</h2>

    <!-- تسجيل الدخول -->
    <div id="auth-section">
        <p style="font-size: 11px; color: #555; text-align: center; margin: 2px;">الحد الأقصى 5 حسابات مسجلة فقط</p>
        <input type="text" id="username" placeholder="اسم المستخدم (Hemo للأدمن)">
        <input type="password" id="password" placeholder="كلمة المرور">
        
        <div class="terms-box">
            <b>شروط الاستخدام:</b> منع الإساءة، يحق للإدارة الحظر أو الحذف لتفريغ مساحة.
        </div>
        <label style="font-size: 11px; display: flex; align-items: center; gap: 5px; margin-bottom: 6px;">
            <input type="checkbox" id="terms-check" style="width: auto; margin:0;" checked> أوافق على الشروط والأحكام
        </label>

        <button onclick="register()">تسجيل حساب جديد</button>
        <button onclick="login()" style="background: #34b7f1;">تسجيل الدخول</button>
        <p id="auth-error" class="error"></p>
    </div>

    <!-- قسم الشات -->
    <div id="chat-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <span id="current-user-label" style="font-weight: bold; color: #075e54; font-size: 14px;"></span>
            <button onclick="logout()" style="width: auto; padding: 4px 8px; background: #ff4d4d; font-size: 11px;">خروج</button>
        </div>

        <!-- لوحة تحكم الأدمن -->
        <div id="admin-section" class="admin-panel hidden">
            <b>👑 لوحة تحكم الإدارة:</b>
            <div id="users-list" style="margin: 5px 0; font-size: 12px;">جاري تحميل المستخدمين...</div>
        </div>

        <!-- إضافة يوزر جديد للقائمة السريعة -->
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <input type="text" id="new-contact-input" placeholder="اكتب يوزر لإضافته للقائمة..." style="margin: 0; font-size: 12px; padding: 6px;">
            <button onclick="addCustomContact()" style="width: 80px; margin: 0; font-size: 11px; background: #075e54;">+ إضافة</button>
        </div>

        <!-- قائمة المحادثات السريعة المحفوظة -->
        <div style="font-size: 11px; color: #666; margin-bottom: 2px;">المحادثات السريعة (اختر للتحدث):</div>
        <div id="contacts-list" class="contacts-bar">
            <span style="font-size: 11px; color: #999;">لا توجد جهات اتصال محفوظة</span>
        </div>

        <input type="text" id="receiver" placeholder="الشخص المحدد للمراسلة" readonly style="background: #f8f9fa; font-weight: bold; color: #075e54;">
        <div id="chat-box"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="message-text" placeholder="اكتب رسالة..." style="margin: 0; flex: 1;">
            <button onclick="sendMessage()" style="width: 70px; margin: 0;">إرسال</button>
        </div>
    </div>
</div>

<!-- صوت التنبيه للرسائل -->
<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
    const SERVER_URL = "https://mine-chat1.onrender.com";
    let chatInterval = null;
    let lastMsgId = 0;

    window.onload = function() {
        const savedUser = localStorage.getItem('mine_user');
        const savedAdmin = localStorage.getItem('mine_admin') === 'true';
        if (savedUser) {
            startChatSession(savedUser, savedAdmin, savedUser.toLowerCase() === 'hemo');
        }
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    };

    function showError(msg) {
        document.getElementById('auth-error').innerText = msg;
    }

    async function register() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const acceptTerms = document.getElementById('terms-check').checked;

        if(!username || !password) return showError("الرجاء ملء الحقول!");
        if(!acceptTerms) return showError("يجب الموافقة على الشروط!");

        try {
            const res = await fetch(`${SERVER_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, acceptTerms })
            });
            const data = await res.json();
            if(res.ok) {
                alert("تم إنشاء الحساب بنجاح!");
                showError("");
            } else {
                showError(data.error);
            }
        } catch(e) {
            showError("فشل الاتصال بالسيرفر");
        }
    }

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if(!username || !password) return showError("الرجاء ملء الحقول!");

        try {
            const res = await fetch(`${SERVER_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('mine_user', data.username);
                localStorage.setItem('mine_admin', data.isAdmin);
                startChatSession(data.username, data.isAdmin, data.verified);
            } else {
                showError(data.error);
            }
        } catch(e) {
            showError("فشل الاتصال بالسيرفر");
        }
    }

    function startChatSession(username, isAdmin, verified) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('chat-section').classList.remove('hidden');
        
        let badgeHtml = (verified || username.toLowerCase() === 'hemo') ? '<span class="verified-badge">✓</span>' : '';
        document.getElementById('current-user-label').innerHTML = `أهلاً: ${username} ${badgeHtml}`;

        if(isAdmin || username.toLowerCase() === 'hemo') {
            document.getElementById('admin-section').classList.remove('hidden');
            fetchAdminUsers(username);
        }

        renderContacts();

        if(chatInterval) clearInterval(chatInterval);
        chatInterval = setInterval(() => {
            const receiver = document.getElementById('receiver').value.trim();
            if(receiver) fetchMessages(username, receiver);
            if(isAdmin || username.toLowerCase() === 'hemo') fetchAdminUsers(username);
        }, 2000);
    }

    function getStoredContacts() {
        const currentUser = localStorage.getItem('mine_user');
        const contacts = localStorage.getItem(`contacts_${currentUser}`);
        return contacts ? JSON.parse(contacts) : [];
    }

    function addCustomContact() {
        const input = document.getElementById('new-contact-input');
        const contactName = input.value.trim();
        const currentUser = localStorage.getItem('mine_user');

        if(!contactName) return alert("اكتب اسم المستخدم أولاً!");
        if(contactName === currentUser) return alert("لا يمكنك إضافة نفسك!");

        let contacts = getStoredContacts();
        if(!contacts.includes(contactName)) {
            contacts.push(contactName);
            localStorage.setItem(`contacts_${currentUser}`, JSON.stringify(contacts));
            input.value = "";
            renderContacts();
            selectReceiver(contactName);
        } else {
            alert("هذا المستخدم موجود مسبقاً في القائمة!");
        }
    }

    function renderContacts() {
        const contactsDiv = document.getElementById('contacts-list');
        const contacts = getStoredContacts();
        contactsDiv.innerHTML = "";

        if(contacts.length === 0) {
            contactsDiv.innerHTML = '<span style="font-size: 11px; color: #999;">لا توجد جهات اتصال محفوظة، أضف يوزر بالأعلى</span>';
            return;
        }

        contacts.forEach(user => {
            contactsDiv.innerHTML += `<div class="contact-chip" onclick="selectReceiver('${user}')">💬 ${user} <span onclick="event.stopPropagation(); removeContact('${user}')" style="color:red; font-size:10px; cursor:pointer;">✖</span></div>`;
        });
    }

    function removeContact(username) {
        const currentUser = localStorage.getItem('mine_user');
        let contacts = getStoredContacts();
        contacts = contacts.filter(c => c !== username);
        localStorage.setItem(`contacts_${currentUser}`, JSON.stringify(contacts));
        renderContacts();
    }

    function selectReceiver(username) {
        document.getElementById('receiver').value = username;
        const currentUser = localStorage.getItem('mine_user');
        fetchMessages(currentUser, username);
    }

    async function fetchAdminUsers(adminUser) {
        try {
            const res = await fetch(`${SERVER_URL}/admin/users?adminUser=${adminUser}`);
            if(!res.ok) return;
            const users = await res.json();
            const listDiv = document.getElementById('users-list');
            listDiv.innerHTML = "";
            
            if(users.length === 0) {
                listDiv.innerHTML = "لا توجد حسابات مسجلة حالياً";
                return;
            }

            users.forEach(u => {
                listDiv.innerHTML += `<div style="display: flex; justify-content: space-between; align-items: center; margin: 3px 0;">
                    <span>👤 ${u.username} ${u.isBanned ? '(محظور)' : ''}</span>
                    <div>
                        ${u.username.toLowerCase() !== 'hemo' ? `
                            <button onclick="banUser('${u.username}', '${adminUser}')" style="padding:2px 6px; background:orange; font-size:10px; width:auto; margin-left:3px;">حظر</button> 
                            <button onclick="deleteUser('${u.username}', '${adminUser}')" style="padding:2px 6px; background:red; font-size:10px; width:auto;">حذف</button>
                        ` : '<span style="color:blue; font-size:10px;">(الأدمن الرئيسي)</span>'}
                    </div>
                </div>`;
            });
        } catch(e) {
            console.error("خطأ في جلب مستخدمي الأدمن");
        }
    }

    async function banUser(target, adminUser) {
        if(!confirm(`حظر ${target} لمدة 24 ساعة؟`)) return;
        await fetch(`${SERVER_URL}/admin/ban-user`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({adminUser, targetUser: target})
        });
        fetchAdminUsers(adminUser);
    }

    async function deleteUser(target, adminUser) {
        if(!confirm(`حذف حساب ${target} لتفريغ مكانه؟`)) return;
        await fetch(`${SERVER_URL}/admin/delete-user`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({adminUser, targetUser: target})
        });
        fetchAdminUsers(adminUser);
    }

    async function sendMessage() {
        const currentUser = localStorage.getItem('mine_user');
        const receiver = document.getElementById('receiver').value.trim();
        const text = document.getElementById('message-text').value.trim();
        if(!receiver || !text) return alert("اختر شخص من القائمة فوق أولاً واكتب الرسالة!");

        try {
            const res = await fetch(`${SERVER_URL}/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUser, receiver, text })
            });
            const data = await res.json();
            if(res.ok) {
                document.getElementById('message-text').value = "";
                fetchMessages(currentUser, receiver);
            } else {
                alert(data.error);
            }
        } catch(e) {}
    }

    async function fetchMessages(currentUser, receiver) {
        try {
            const res = await fetch(`${SERVER_URL}/messages?user1=${currentUser}&user2=${receiver}`);
            const messages = await res.json();
            const chatBox = document.getElementById('chat-box');
            
            if (messages.length > 0) {
                const latestMsg = messages[messages.length - 1];
                if (latestMsg.id > lastMsgId && latestMsg.sender !== currentUser) {
                    lastMsgId = latestMsg.id;
                    document.getElementById('notif-sound').play().catch(e => {});
                    if (Notification.permission === "granted") {
                        new Notification(`رسالة جديدة من ${latestMsg.sender}`, { body: latestMsg.text });
                    }
                }
            }

            chatBox.innerHTML = "";
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `msg ${msg.sender === currentUser ? 'my-msg' : 'other-msg'}`;
                let badgeHtml = (msg.verified || msg.sender.toLowerCase() === 'hemo') ? '<span class="verified-badge">✓</span>' : '';
                div.innerHTML = `<b>${msg.sender}</b> ${badgeHtml}: ${msg.text}`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch(e) {}
    }

    function logout() {
        localStorage.removeItem('mine_user');
        localStorage.removeItem('mine_admin');
        clearInterval(chatInterval);
        location.reload();
    }
</script>

</body>
</html>
